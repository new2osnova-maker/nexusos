function ccSync(){const c=$('cc');if(!c.dataset.b)return;$('ccBr').value=set.br;$('ccVo').value=vol*100;$('tNl').classList.toggle('on',set.nl>0);$('tMs').classList.toggle('on',!!msOn);$('tDnd').classList.toggle('on',!!set.dnd)}
$('cc').innerHTML='<div class="tl"><button class="tile on" id="tWf">'+svg('wifi',22)+'Wi-Fi</button><button class="tile on" id="tBt">'+svg('bt',22)+'Bluetooth</button><button class="tile" id="tNl">'+svg('moon',22)+'Ночной свет</button><button class="tile" id="tDnd">'+svg('bell',22)+'Не беспокоить</button><button class="tile" id="tMs" style="grid-column:1/-1">'+svg('mouse',22)+'Режим мыши (тачпад)</button></div><div class="sl">'+svg('sun',20)+'<input type="range" id="ccBr" min="20" max="100"></div><div class="sl">'+svg('vol',20)+'<input type="range" id="ccVo" min="0" max="100"></div><div style="display:flex;gap:8px"><button class="btn" id="ccLk" style="flex:1;justify-content:center">'+svg('lock',16)+'Блокировка</button><button class="btn" id="ccSt" style="flex:1;justify-content:center">'+svg('gear',16)+'Настройки</button></div>';
$('cc').dataset.b=1;
$('tWf').onclick=e=>e.currentTarget.classList.toggle('on');$('tBt').onclick=e=>e.currentTarget.classList.toggle('on');
$('tNl').onclick=()=>{set.nl=set.nl?0:50;applySet()};$('tDnd').onclick=()=>{set.dnd=set.dnd?0:1;applySet()};$('tMs').onclick=()=>{closePops();mouse(!msOn)};
$('ccBr').oninput=e=>{set.br=+e.target.value;applySet()};$('ccVo').oninput=e=>setVol(e.target.value/100);
$('ccLk').onclick=()=>lockScr();$('ccSt').onclick=()=>openApp('settings');
function closePops(){$('cc').classList.remove('show');$('spot').classList.remove('show')}
$('bTime').onclick=$('stat').onclick=e=>{e.stopPropagation();const s=$('cc').classList.contains('show');closePops();if(!s)$('cc').classList.add('show')};
addEventListener('pointerdown',e=>{if(!e.target.closest('#cc,#bTime,#stat'))$('cc').classList.remove('show')});
$('bPs').innerHTML=svg('search',16);$('bPill').onclick=()=>spot();
function spot(){closePops();$('spot').classList.add('show');$('sIn').value='';sRes();$('sIn').focus()}
let sList=[];
function sRes(){const q=$('sIn').value.trim().toLowerCase(),r=[];
if(/^[0-9+\-*\/().% ]+$/.test(q)&&/[+\-*\/%]/.test(q)){try{const v=Function('"use strict";return '+q)();if(isFinite(v))r.push({t:q+' = '+v,s:'Калькулятор',ic:'plus',g:'#14b8a6,#3b82f6',f:()=>{}})}catch(e){}}
APPS.filter(a=>!q||a.n.toLowerCase().includes(q)||a.id.includes(q)).forEach(a=>r.push({t:a.n,s:'Приложение',ic:a.ic,g:a.g,f:()=>openApp(a.id)}));
if(q.length>1)r.push({t:'Спросить ИИ: '+q,s:'NEXUS AI',ic:'ai',g:'#8b5cf6,#06b6d4',f:()=>{openApp('ai');$('aiI').value=q;aiSend()}});
sList=r.slice(0,7);$('sRes').innerHTML=sList.map((x,i)=>'<button class="row" data-i="'+i+'">'+sq(x,'mini')+'<b>'+esc(x.t)+'</b><i class="mut">'+x.s+'</i></button>').join('')}
$('sIn').oninput=sRes;$('sIn').onkeydown=e=>{if(e.key==='Enter'&&sList[0]){closePops();sList[0].f()}if(e.key==='Escape')closePops()};
$('sRes').onclick=e=>{const b=e.target.closest('[data-i]');if(b){const x=sList[+b.dataset.i];closePops();x.f()}};
$('spot').addEventListener('pointerdown',e=>{if(e.target===$('spot'))closePops()});
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();spot()}if(e.altKey&&e.key==='F4'&&act)closeW(act);if(e.key==='Escape')closePops()});
function lockScr(){closePops();$('lpw').style.display=$('lgo').style.display=set.pw?'':'none';$('lpw').value='';$('lh').textContent=set.pw?'':'Нажми, чтобы войти';$('lock').classList.remove('hide')}
function unlock(){if(set.pw&&hs($('lpw').value)!==set.pw){toast('Неверный пароль');$('lpw').value='';return}$('lock').classList.add('hide');toast('Добро пожаловать!')}
$('lock').addEventListener('click',e=>{if(!set.pw)unlock()});$('lgo').onclick=unlock;$('lpw').onkeydown=e=>{if(e.key==='Enter')unlock()};
/* ---------- status, clock ---------- */
function clock(){const d=new Date(),t=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),ds=d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});$('tm').textContent=t;$('dt').textContent=d.toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'short'});$('wTime').textContent=t;$('wDate').textContent=ds;$('lT').textContent=t;$('lD').textContent=ds}
setInterval(clock,5000);clock();
function net(){$('bWifi').innerHTML='<span style="opacity:'+(navigator.onLine?1:.35)+'">'+svg('wifi',18)+'</span>'}
addEventListener('online',net);addEventListener('offline',net);net();
function bat(p,ch){$('bBat').innerHTML='<span style="display:flex;align-items:center;gap:5px">'+(p==null?'':Math.round(p*100)+'%')+svg('bat',20)+'</span>'}
bat(null);if(navigator.getBattery)navigator.getBattery().then(b=>{window._bat=b;const u=()=>bat(b.level,b.charging);u();b.onlevelchange=u;b.onchargingchange=u}).catch(()=>{});

/* ---------- mouse / touchpad mode ---------- */
var msOn=false;let cx=innerWidth/2,cy=innerHeight/2,lmb=0,dragOn=0,l0=[0,0],lastTap=0,dragR=null;
const cur=$('cur'),pad=$('pad'),pbar=$('pbar');
const curMove=()=>{cur.style.transform='translate('+(cx-3)+'px,'+(cy-2)+'px)'};
function under(){pad.style.pointerEvents='none';pbar.style.pointerEvents='none';const el=document.elementFromPoint(cx,cy);pad.style.pointerEvents='';pbar.style.pointerEvents='';return el}
function fire(t,el){el&&el.dispatchEvent(new PointerEvent(t,{bubbles:true,cancelable:true,clientX:cx,clientY:cy,pointerId:99,pointerType:'mouse',isPrimary:true,button:0,buttons:t==='pointerup'?0:1,view:window}))}
function rng(el){const r=el.getBoundingClientRect(),q=cl((cx-r.left)/r.width,0,1),a=+el.min||0,b=el.max===''?100:+el.max;el.value=a+q*(b-a);el.dispatchEvent(new Event('input',{bubbles:true}))}
function clickAt(el){el.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,clientX:cx,clientY:cy,view:window}));const f=el.closest&&el.closest('input,textarea,select');if(f&&f.type!=='range')f.focus();const n=Date.now();if(n-lastTap<350)el.dispatchEvent(new MouseEvent('dblclick',{bubbles:true,cancelable:true,clientX:cx,clientY:cy,view:window}));lastTap=n}
function mdown(){l0=[cx,cy];const el=under();dragR=el&&el.type==='range'?el:null;if(dragR)rng(dragR);fire('pointerdown',el)}
function mup(){const el=under();fire('pointerup',el);if(dragR){dragR=null;return}if(el&&Math.hypot(cx-l0[0],cy-l0[1])<8)clickAt(el)}
function scrollAt(dy){let n=under();while(n&&n!==document.body){const st=getComputedStyle(n);if(/(auto|scroll)/.test(st.overflowY)&&n.scrollHeight>n.clientHeight){n.scrollTop-=dy*1.6;return}n=n.parentElement}}
const ptrs=new Map();let tStart=0,moved=0;
pad.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,[e.clientX,e.clientY]);if(ptrs.size===1){tStart=Date.now();moved=0}try{pad.setPointerCapture(e.pointerId)}catch(x){}});
pad.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p[0],dy=e.clientY-p[1];p[0]=e.clientX;p[1]=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
if(ptrs.size>=2){if(e.isPrimary)scrollAt(dy);return}
const g=1.5+Math.min(Math.hypot(dx,dy)/12,1.5);cx=cl(cx+dx*g,0,innerWidth-1);cy=cl(cy+dy*g,0,innerHeight-1);curMove();
if(dragOn||lmb){fire('pointermove',under());if(dragR)rng(dragR)}});
const pend=e=>{if(!ptrs.has(e.pointerId))return;const n=ptrs.size;ptrs.delete(e.pointerId);if(n===1&&e.type==='pointerup'&&Date.now()-tStart<300&&moved<12){mdown();mup()}};
pad.addEventListener('pointerup',pend);pad.addEventListener('pointercancel',pend);
const pL=$('pL');pL.onpointerdown=e=>{e.preventDefault();lmb=1;mdown();try{pL.setPointerCapture(e.pointerId)}catch(x){}};
const lup=()=>{if(!lmb)return;lmb=0;mup()};pL.onpointerup=lup;pL.onpointercancel=lup;
$('pR').onpointerdown=e=>{e.preventDefault();const el=under();el&&el.dispatchEvent(new MouseEvent('contextmenu',{bubbles:true,cancelable:true,clientX:cx,clientY:cy,view:window,button:2}))};
$('pD').onclick=function(){dragOn=dragOn?0:1;this.classList.toggle('on',!!dragOn);if(dragOn)mdown();else mup()};
$('pX').onclick=()=>mouse(false);
function mouse(on){msOn=on;pad.classList.toggle('show',on);pbar.classList.toggle('show',on);cur.style.display=on?'block':'none';if(on){curMove();toast('Мышь: води пальцем, тап — клик, два пальца — прокрутка')}else{dragOn=0;lmb=0;$('pD').classList.remove('on')}ccSync()}
$('bMs').innerHTML=svg('mouse',20);$('bMs').onclick=()=>mouse(!msOn);
/* ---------- context menu ---------- */
function showCtx(x,y,items){const m=$('ctx');m.innerHTML=items.map((it,i)=>'<button data-i="'+i+'">'+it.t+'</button>').join('');m.style.display='block';m.style.left=cl(x,6,innerWidth-m.offsetWidth-6)+'px';m.style.top=cl(y,6,innerHeight-m.offsetHeight-6)+'px';m._it=items}
$('ctx').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;const it=$('ctx')._it[+b.dataset.i];$('ctx').style.display='none';it.f()};
document.addEventListener('contextmenu',e=>{const t=e.target;if(t.closest('input,textarea'))return;e.preventDefault();const row=t.closest('.row[data-p]');let items=[];
if(row){const p=row.dataset.p,d=row.dataset.d==='1';items=[{t:'Открыть',f:()=>{if(d){cwd=p;fRender()}else openNote(p)}},{t:'Удалить',f:async()=>{try{await FS.rm(p)}catch(x){toast('Не удалось удалить')}fRender()}}]}
else if(t.closest('#desk')||t.id==='wall')items=[{t:'Настройки',f:()=>openApp('settings')},{t:'Файлы',f:()=>openApp('files')},{t:'Новая заметка',f:()=>{openApp('notes');$('nNew').click()}},{t:'Заблокировать',f:lockScr}];
if(items.length)showCtx(e.clientX,e.clientY,items)});
addEventListener('pointerdown',e=>{if(!e.target.closest('#ctx'))$('ctx').style.display='none'},true);
let lpT;addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&!msOn&&e.target.closest('.row[data-p],#desk')){const x=e.clientX,y=e.clientY,t=e.target;lpT=setTimeout(()=>t.dispatchEvent(new MouseEvent('contextmenu',{bubbles:true,cancelable:true,clientX:x,clientY:y})),600)}});
['pointerup','pointercancel'].forEach(n=>addEventListener(n,()=>clearTimeout(lpT)));
/* ---------- boot ---------- */
applySet();dockR();ccSync();lockScr();FS.init();wxR();if(set.city)wxLoad();
</script>
</body>
