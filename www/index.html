<!DOCTYPE html>
<html lang="ru">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NEXUS — Windows 12 Web OS</title>
<style>
:root{--accent:#67d7ff;--txt:#f4f8ff;--mut:#9fb2c9;--ln:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--txt);font:13px 'Segoe UI Variable','Segoe UI',Inter,system-ui,sans-serif;user-select:none;touch-action:none}
button,input,textarea{font:inherit;color:inherit}
button{border:1px solid var(--ln);background:rgba(255,255,255,.08);border-radius:8px;padding:7px 12px;cursor:pointer;transition:.15s}
button:hover{background:rgba(255,255,255,.18)}button:active{transform:scale(.96)}
button.on,button.pri{background:var(--accent);color:#06121f;border-color:transparent;font-weight:600}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#06101c}
#wall{position:absolute;inset:0;transition:background .4s}
.ic{position:absolute;left:18px;top:16px;display:grid;grid-template-rows:repeat(5,92px);grid-auto-flow:column;gap:4px}
.di{width:84px;height:84px;border-radius:10px;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12px;text-shadow:0 1px 4px #000a;text-align:center}
.di b{font-size:30px;font-weight:400}.di:hover,.di.sel{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22)}
.glass{background:rgba(24,30,44,.66);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);border:1px solid var(--ln)}

body.noanim *{transition:none!important;animation:none!important}
#top{position:absolute;top:10px;left:50%;transform:translateX(-50%);height:34px;padding:0 16px;border-radius:17px;display:flex;align-items:center;gap:9px;z-index:3000;cursor:pointer}
#top i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
#isl{position:absolute;top:52px;left:50%;transform:translate(-50%,-8px);display:none;gap:10px;z-index:3000;opacity:0;transition:.2s}
#isl.show{display:flex;opacity:1;transform:translate(-50%,0)}
.card{width:250px;padding:14px;border-radius:16px}#tmus{display:none;align-items:center;gap:6px}#tmus button{padding:2px 9px;border-radius:10px}#tmn{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card h4{margin:0 0 6px}.card p{margin:0 0 8px;color:var(--mut);font-size:12px}

.tbb{position:relative;width:44px;height:44px;border:0;border-radius:10px;background:transparent;font-size:22px;padding:0}
.tbb:hover{background:rgba(255,255,255,.14)}.tbb.act{background:rgba(255,255,255,.12)}
.tbb::after{content:"";position:absolute;bottom:2px;left:50%;width:0;height:3px;border-radius:2px;background:var(--accent);transform:translateX(-50%);transition:.2s}
.tbb.run::after{width:6px;background:#9fb2c9}.tbb.act::after{width:18px;background:var(--accent)}
.tbb.st{background:linear-gradient(140deg,var(--accent),#6b7dff);color:#05121f;font-weight:900}
.sep{width:1px;height:26px;background:var(--ln);margin:0 4px}
.tray{display:flex;align-items:center;gap:8px;padding:0 6px;font-size:12px;line-height:1.15;text-align:right;cursor:pointer}
.pop{position:absolute;display:none;border-radius:20px;padding:16px;z-index:2950;box-shadow:0 24px 70px #000a}.pop.show{display:block;animation:pu .18s}
@keyframes pu{from{opacity:0;transform:translateY(14px)}}
#start{left:50%;bottom:78px;width:420px;margin-left:-210px}#quick{right:14px;bottom:78px;width:330px}
.fld{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--ln);background:rgba(255,255,255,.08);outline:none;user-select:text}
.fld:focus{border-color:var(--accent)}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.ai{padding:10px 2px;text-align:center;border-radius:10px;font-size:11px}.ai:hover{background:rgba(255,255,255,.12)}.ai b{display:block;font-size:26px;font-weight:400;margin-bottom:4px}
.qg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.qg button{text-align:left;padding:12px}
.sl{display:flex;justify-content:space-between;align-items:center;margin:12px 0}input[type=range]{accent-color:var(--accent);width:180px}
#ctx{position:absolute;display:none;min-width:200px;padding:6px;border-radius:12px;z-index:3500}#ctx button{display:block;width:100%;text-align:left;border:0;background:none}
.win{position:absolute;display:none;flex-direction:column;border-radius:12px;background:rgba(28,35,50,.74);backdrop-filter:blur(34px) saturate(1.6);-webkit-backdrop-filter:blur(34px) saturate(1.6);border:1px solid rgba(255,255,255,.16);box-shadow:0 22px 60px rgba(0,0,0,.55);overflow:hidden;opacity:0;transform:scale(.93);transition:opacity .18s,transform .18s}
.win.show{display:flex}.win.in{opacity:1;transform:none}.win.min{opacity:0;transform:translateY(70px) scale(.8);pointer-events:none}
.win.act{border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 26px 80px rgba(0,0,0,.65)}.win.max{border-radius:0}
.tt{height:38px;flex:none;display:flex;justify-content:space-between;align-items:center;padding-left:14px;background:rgba(255,255,255,.05);touch-action:none;cursor:default}
.wc{display:flex;height:100%}.wc button{width:46px;height:100%;border:0;border-radius:0;background:none;font-size:14px}.wc button:hover{background:rgba(255,255,255,.14)}.wc .cl:hover{background:#e5384f}
.wb{flex:1;min-height:0;overflow:auto;position:relative}
.rz{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 55%,rgba(255,255,255,.35) 56% 62%,transparent 63% 72%,rgba(255,255,255,.35) 73% 79%,transparent 80%)}
.exw{display:flex;height:100%}.exs{width:170px;flex:none;padding:10px;display:flex;flex-direction:column;gap:5px;border-right:1px solid var(--ln);overflow:auto}
.exs button{text-align:left;border:0;background:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.exs button.on{background:rgba(255,255,255,.14)}
.exm{flex:1;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:8px;align-items:center}.path{flex:1;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.07)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;overflow:auto;align-content:start}
.it{position:relative;padding:12px 6px;text-align:center;border-radius:10px;border:1px solid transparent;word-break:break-word}.it:hover{background:rgba(255,255,255,.1);border-color:var(--ln)}

.mut{color:var(--mut)}textarea.fld{flex:1;resize:none;line-height:1.5;font-family:Consolas,monospace}
.tabs{display:flex;gap:3px;padding:6px 6px 0;background:rgba(0,0,0,.2);overflow:auto}.tab{padding:7px 10px;border-radius:8px 8px 0 0;background:rgba(255,255,255,.06);white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis;font-size:12px}.tab.on{background:rgba(255,255,255,.17)}
.page{background:#f5f7fb;color:#172238;padding:22px;height:100%;overflow:auto;user-select:text}.page h1{margin:0 0 8px}.page a{color:#1a6dcc;cursor:pointer;display:block;margin:6px 0}.page .fld{background:#fff;color:#172238;border-color:#cfd8e5}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:260px}.calc button{background:#e3e9f3;color:#172238;border-color:#cfd8e5;padding:12px}
.set{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln)}
.wp{width:92px;height:56px;border-radius:8px;border:2px solid transparent;display:inline-block;margin:0 6px 6px 0;cursor:pointer}.wp.on{border-color:#fff}
.tg{width:42px;height:22px;border-radius:12px;background:#556078;padding:3px;transition:.2s}.tg::after{content:"";display:block;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--accent)}.tg.on::after{transform:translateX(20px)}
.term{padding:10px;background:#07101b;height:100%;font:12.5px/1.55 Consolas,monospace;color:#9de7b7;overflow:auto;user-select:text}.term input{background:none;border:0;outline:0;color:#fff;width:70%;font:inherit}
.chat{display:flex;flex-direction:column;gap:8px;padding:12px;overflow:auto;flex:1}.msg{padding:9px 12px;border-radius:12px;max-width:85%;background:rgba(255,255,255,.1);user-select:text}.msg.me{align-self:flex-end;background:color-mix(in srgb,var(--accent) 35%,transparent)}
#gw{position:absolute;inset:0}#gc{width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:8px;left:12px;right:12px;display:flex;justify-content:space-between;font-weight:700;pointer-events:none;text-shadow:0 2px 6px #000}

#kn{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:var(--accent);opacity:.8;pointer-events:none}
#spr{position:absolute;right:22px;bottom:34px;width:84px;height:84px;border-radius:50%;touch-action:none;font-weight:700}
.ov{position:absolute;inset:0;display:none;z-index:4000}.ov.show{display:flex}
#boot{background:#04080f;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.sp{width:34px;height:34px;border:3px solid #fff2;border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#login{background:linear-gradient(135deg,#071326,#17425f);flex-direction:column;align-items:center;justify-content:center;gap:10px}
#bios{background:#0a2a6a;color:#dfe9ff;font:15px Consolas,monospace;flex-direction:column;z-index:4100}
#bios .bh{background:#c4c9d4;color:#102040;padding:8px 20px;font-weight:700}#bios .bt{display:flex;background:#1b4aa0}.bt div{padding:8px 22px;cursor:pointer}.bt div.on{background:#c4c9d4;color:#102040}
#bios .bm{display:flex;flex:1}.bl{flex:1;padding:18px 24px}.br{width:300px;border-left:2px solid #7fa0e0;padding:18px;color:#bcd0ff}
.bi{display:flex;justify-content:space-between;padding:6px 10px;cursor:pointer}.bi.on{background:#e6ebf7;color:#0a2a6a}.bf{background:#c4c9d4;color:#102040;padding:8px 20px;font-size:13px}
#dim,#warm{position:absolute;inset:0;pointer-events:none;z-index:5000}#warm{background:#ff8a1e;mix-blend-mode:multiply;opacity:0}
#toast{position:absolute;right:16px;top:14px;padding:11px 16px;border-radius:12px;background:#10223bf0;border:1px solid var(--ln);z-index:5500;opacity:0;transform:translateY(-8px);transition:.25s;pointer-events:none}
#cur{position:absolute;width:22px;height:22px;z-index:6000;pointer-events:none;display:none;filter:drop-shadow(0 2px 3px #000a)}
#pad{position:absolute;inset:0;z-index:3400;display:none;touch-action:none}
#pad small{position:absolute;top:56px;left:50%;transform:translateX(-50%);padding:5px 12px;border-radius:12px;background:#0008;color:#cfe3f7;pointer-events:none;white-space:nowrap}#pad div{position:absolute;left:12px;bottom:10px;display:flex;gap:8px}#pad button{height:56px;padding:0 18px;font-size:14px;background:rgba(10,20,36,.9);touch-action:none}#pX{display:none}#pad button{padding:10px 14px;font-size:12px;background:rgba(10,20,36,.88)}
#rot{position:fixed;inset:0;background:#000d;z-index:9;display:none;align-items:center;justify-content:center;text-align:center;font-size:18px;pointer-events:none}
@media(orientation:portrait){#rot{display:flex}}
</style>
</head>
<body>

 <div id="isl"><div class="card glass"><h4>◈ Центр активности</h4><p id="cpuinfo"></p><button onclick="openApp('settings')">Параметры</button></div><div class="card glass"><h4 id="isn">♫ Музыка</h4><p>NEXUS Music</p><button id="plb" onclick="musToggle()">▶</button> <button onclick="openApp('music')">Плеер</button></div></div>

 <div id="dim"></div><div id="warm"></div><div id="toast"></div>

</div>
<script>
const $=i=>document.getElementById(i),stage=$('stage');let S=1;
const ld=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('Нет места в хранилище');return false}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));addEventListener('load',fit);if(window.visualViewport){visualViewport.addEventListener('resize',fit);visualViewport.addEventListener('scroll',fit)}[100,400,1000].forEach(t=>setTimeout(fit,t));fit();

/* ---------- settings ---------- */
const WALLS=['radial-gradient(ellipse at 70% 20%,#2f78a8,transparent 42%),radial-gradient(ellipse at 20% 90%,#1b4a7a,transparent 45%),linear-gradient(135deg,#09172e,#173e62)','linear-gradient(135deg,#1b0b3a,#a1306f 60%,#f7a35c)','linear-gradient(160deg,#04201a,#0d6b52 55%,#a9e5b2)','radial-gradient(circle at 30% 20%,#5b5bd6,transparent 45%),linear-gradient(135deg,#0b0b1f,#2a1b5e)','linear-gradient(135deg,#15151a,#3d3d46 60%,#8a8a96)'];

/* ---------- BIOS config ---------- */

let bc=Object.assign({cpu:0,fast:1,virt:1,b:['NEXUS Disk','USB Drive','Network']},ld('nx_bios',{}));

let fs=ld('nx_fs',null)||{c:{n:'Диск C:',t:'d',p:null},desk:{n:'Рабочий стол',t:'d',p:'c'},docs:{n:'Документы',t:'d',p:'c'},dl:{n:'Загрузки',t:'d',p:'c'},w:{n:'Добро пожаловать.txt',t:'f',p:'docs',c:'Добро пожаловать в NEXUS!\nВсе файлы хранятся в localStorage.'},r:{n:'readme.txt',t:'f',p:'desk',c:'Открой Заметки — текст сохраняется автоматически.'}};

const kids=id=>Object.keys(fs).filter(k=>fs[k].p===id).sort((a,b)=>fs[a].t<fs[b].t?-1:fs[a].t>fs[b].t?1:fs[a].n.localeCompare(fs[b].n));
const pathOf=id=>{const a=[];while(id){a.unshift(fs[id].n);id=fs[id].p}return a.join(' › ')};
function rm(id){kids(id).forEach(rm);delete fs[id]}
function mkNode(p,t,n,c){n=n.trim();if(!n)return toast('Введи имя'),null;if(kids(p).some(k=>fs[k].n===n))return toast('Такое имя уже есть'),null;const id=uid();fs[id]={n,t,p,c:c||''};saveFs();return id}
/* ---------- window manager ---------- */
const wins={};let zi=20,actW=null;const APPS=[['browser','🌐','Браузер'],['files','📁','Проводник'],['notes','📝','Заметки'],['settings','⚙️','Параметры'],['game','🕹️','NEON//DRIFT'],['music','🎵','Музыка'],['terminal','⌨️','Терминал'],['assistant','✦','ИИ-помощник']];
function mkWin(n,title,icon,w,h,x,y,init,onopen,onclose){const el=document.createElement('div');el.className='win';el.style.cssText='left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px';
el.innerHTML='<div class="tt"><span>'+icon+' '+title+'</span><span class="wc"><button data-a="m">—</button><button data-a="x">☐</button><button data-a="c" class="cl">✕</button></span></div><div class="wb"></div><i class="rz"></i>';$('wins').appendChild(el);

el.addEventListener('pointerdown',()=>focusW(n),true);

if(T.lead&&s%2===0&&Math.random()<.4){const P=[0,3,5,7,10];tone(mn(c[0]+24+P[Math.floor(Math.random()*5)]),t,sd*3,T.lead,.05)}
if(T.hat&&s%2===1)drum(t,0)}
function synStop(){clearInterval(stm);stm=0;if(sb){const b=sb;b.gain.setTargetAtTime(0,actx.currentTime,.05);setTimeout(()=>b.disconnect(),500);sb=null}}
function synStart(from){synStop();sb=actx.createGain();sb.connect(an);si=from||0;let nt=actx.currentTime+.08;stm=setInterval(()=>{while(nt<actx.currentTime+.3){sStep(si,nt);nt+=60/SYN[pl[pi].s].bpm/4;si++}},60)}
function mplayI(i){ensA();pi=(i+pl.length)%pl.length;const t=pl[pi];au.pause();synStop();mstarted=1;mplay=1;if(t.url){au.src=t.url;au.play().catch(()=>toast('Не удалось воспроизвести файл'))}else synStart(0);plRender();mui();vizOn()}
function mus(a){if(a==='pp'){if(pi<0)return mplayI(0);ensA();if(mplay){mplay=0;pl[pi].url?au.pause():synStop()}else{mplay=1;pl[pi].url?au.play():synStart(Math.floor(si/16)*16)}mui();vizOn()}else if(a==='next')mplayI(shuf&&pl.length>1?pi+1+Math.floor(Math.random()*(pl.length-1)):pi+1);else if(a==='prev')mplayI(pi-1);else if(a==='shuf'){shuf^=1;toast(shuf?'Перемешивание включено':'Перемешивание выключено')}}

const fm=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
function mui(){const t=pl[pi],pp=mplay?'Ⅱ':'▶',tm=$('tmus');
if(tm){tm.style.display=mstarted?'flex':'none';$('topt').style.display=mstarted?'none':'';$('tmn').textContent='♫ '+(t?t.n:'');tm.querySelector('[data-m=pp]').textContent=pp}
if($('plb'))$('plb').textContent=pp;if($('isn'))$('isn').textContent='♫ '+(t?t.n:'Музыка');
if(!$('mtn'))return;$('mtn').textContent=t?t.n:'Выбери трек';$('mpp').textContent=pp;
let cur=0,dur=0;if(t&&t.url){cur=au.currentTime;dur=au.duration}else if(t){const T=SYN[t.s];dur=T.ch.length*16*60/T.bpm/4;cur=(si*60/T.bpm/4)%dur}
$('mtc').textContent=fm(cur);$('mtd').textContent=t&&!t.url?'∞ луп':fm(dur);if(!seeking&&dur)$('msk').value=cur/dur*1000}
setInterval(mui,300);
function plRender(){$('pl').innerHTML=pl.map((t,i)=>'<button data-p="'+i+'" class="'+(i===pi?'on':'')+'">'+(t.url?'🎧 ':'🎹 ')+esc(t.n)+'</button>').join('')}
function vizOn(){if(vraf)return;const loop=()=>{vraf=0;const c=$('vz');if(!c||!actx||!wins.music.open||wins.music.min)return;const x=c.getContext('2d'),d=new Uint8Array(an.frequencyBinCount);an.getByteFrequencyData(d);x.fillStyle='#07101b';x.fillRect(0,0,c.width,c.height);const n=d.length*.75|0,w=c.width/n,g=x.createLinearGradient(0,c.height,0,0);g.addColorStop(0,'#6b7dff');g.addColorStop(1,getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#67d7ff');x.fillStyle=g;for(let i=0;i<n;i++){const h=d[i]/255*c.height;x.fillRect(i*w+1,c.height-h,w-2,h)}vraf=requestAnimationFrame(loop)};vraf=requestAnimationFrame(loop)}
mkWin('music','Музыка','🎵',640,430,260,80,b=>{b.innerHTML='<div class="exw"><div class="exs" id="pl"></div><div class="exm"><canvas id="vz" width="420" height="120" style="width:100%;height:110px;border-radius:10px"></canvas><b id="mtn">Выбери трек</b><div class="row"><span id="mtc">0:00</span><input type="range" id="msk" min="0" max="1000" value="0" style="flex:1"><span id="mtd">0:00</span></div><div class="row" style="justify-content:center"><button data-m="prev">⏮</button><button class="pri" data-m="pp" id="mpp">▶</button><button data-m="next">⏭</button><button data-m="shuf" title="Перемешать">🔀</button><span>🔊</span><input type="range" id="mvol" min="0" max="100" style="width:110px"></div><div class="row"><button data-m="file">＋ Свои файлы</button><input type="file" id="mfile" accept="audio/*" multiple hidden></div></div></div>';
b.addEventListener('click',e=>{const m=e.target.dataset.m,p=e.target.dataset.p;if(m==='file')$('mfile').click();else if(m)mus(m);if(p!=null)mplayI(+p)});
b.addEventListener('change',e=>{if(e.target.id==='mfile'){const fl=[...e.target.files];fl.forEach(f=>pl.push({n:f.name.replace(/\.[^.]+$/,''),url:URL.createObjectURL(f)}));plRender();toast('Добавлено треков: '+fl.length);e.target.value=''}});
b.addEventListener('input',e=>{if(e.target.id==='mvol')setVol(e.target.value/100);if(e.target.id==='msk'){seeking=1;const t=pl[pi];if(t&&t.url&&au.duration)au.currentTime=e.target.value/1000*au.duration;clearTimeout(seekT);seekT=setTimeout(()=>seeking=0,400)}});
plRender();$('mvol').value=vol*100},()=>{mui();vizOn()});
$('qvol').value=vol*100;$('qvol').oninput=e=>setVol(e.target.value/100);

/* ---------- AI, вход, горячие клавиши ---------- */
let aiName=ld('nx_name','');
const hs=s=>{let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return String(h)};
function lock(){closePops();$('lpw').value='';$('lhint').textContent=ld('nx_pw','')?'Введи пароль':'Пароль не задан — просто нажми «Войти»';$('login').classList.add('show')}
function doLogin(){const p=ld('nx_pw','');if(p&&hs($('lpw').value)!==p){toast('Неверный пароль');$('lpw').value='';return}$('login').classList.remove('show');toast('Добро пожаловать'+(aiName?', '+aiName:'')+'!')}
const APPW={browser:/брауз|интернет|сайт/,files:/провод|файл|папк/,notes:/замет|блокнот/,settings:/настро|параметр/,game:/игр|neon|drift/,terminal:/терминал|консол/,music:/музык|плеер|трек|песн/,assistant:/помощник/};
const COL={красн:'#ff4d6d',син:'#4d7cff',голуб:'#67d7ff',зелен:'#3ddc84',розов:'#ff7ac8',фиолет:'#a06bff',оранж:'#ff9a3d',желт:'#ffd84d',бел:'#ffffff'};
const JK=['— Почему программисты путают Хэллоуин и Рождество? — Потому что Oct 31 = Dec 25.','Заходит байт в бар. Бармен: «Тебе что?» — «Восемь бит, пожалуйста».','Я бы рассказал шутку про UDP, но не уверен, что она до тебя дойдёт.','Windows 12 такая быстрая, что сама успела обновиться до Windows 13.'];
function aiSend(q){const ch=$('chat');ch.insertAdjacentHTML('beforeend','<div class="msg me">'+esc(q)+'</div>');const a=q.split(/\s*(?:;|\sпотом\s|\sзатем\s|\sа потом\s)\s*/i).map(x=>aiBrain(x)).filter(Boolean).join('<br>');setTimeout(()=>{ch.insertAdjacentHTML('beforeend','<div class="msg">'+a+'</div>');ch.scrollTop=1e9},250+Math.min(800,a.length*5));ch.scrollTop=1e9}
function aiBrain(q){const l=q.toLowerCase().replace(/ё/g,'е').trim();let m;const has=r=>r.test(l);if(!l)return'';
if(m=l.match(/меня зовут\s+(.+)/)){aiName=q.trim().slice(l.indexOf(m[1])).trim();sv('nx_name',aiName);return'Приятно познакомиться, '+esc(aiName)+'!'}
if(has(/как меня зовут/))return aiName?'Тебя зовут '+esc(aiName)+'.':'Ты не представился. Напиши «меня зовут …».';
const ms=l.replace(/^(сколько будет|посчитай|вычисли|реши)\s*/,'').replace(/,/g,'.').replace(/[x×х]/g,'*').replace(/÷/g,'/').replace(/\^/g,'**').replace(/\s*=\s*\??$/,'');
if(/^[0-9+\-*\/().% ]+$/.test(ms)&&/\d/.test(ms)&&/[+\-*\/%]/.test(ms)){try{const v=Function('"use strict";return '+ms)();if(isFinite(v))return esc(ms)+' = <b>'+Math.round(v*1e8)/1e8+'</b>'}catch(e){}}
if(has(/привет|здравств|хай|добрый (день|вечер|утро)/))return'Привет'+(aiName?', '+esc(aiName):'')+'! Что сделаем?';
if(has(/спасибо|благодар/))return'Всегда пожалуйста 🙂';
if(has(/как дела|как ты/))return'Работаю на '+CPU[bc.cpu].split(' ')[0]+', всё стабильно. А у тебя?';
if(has(/шутк|анекдот|рассмеши/))return JK[Math.floor(Math.random()*JK.length)];
if(has(/что ты умеешь|помощь|help|команды|кто ты/))return'Я NEXUS AI. Умею: открывать и закрывать приложения, считать («2+2*3»), создавать заметки («создай заметку: купить хлеб»), искать файлы («найди файл readme»), искать в интернете («найди в интернете кошки»), управлять музыкой («включи музыку», «громче», «следующий трек»), менять яркость, ночной свет, обои и цвет («яркость 60», «цвет красный», «обои 3»), блокировать экран, перезагружать в BIOS, говорить время и дату. Несколько команд можно через «потом».';
if(has(/врем|который час|сколько времени/))return'Сейчас <b>'+new Date().toLocaleTimeString('ru-RU')+'</b>';
if(has(/дат[аеуы]|какое число|день недели|какой день/))return'Сегодня <b>'+new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</b>';
if(m=l.match(/найди файл\s+(.+)/)){const r=Object.keys(fs).filter(k=>fs[k].n.toLowerCase().includes(m[1].trim()));return r.length?'Нашёл: '+r.map(k=>esc(pathOf(k))).join('; '):'Ничего не нашёл.'}
if(has(/(покажи|список|какие).*(файл|папк)/))return'Файлы: '+(Object.keys(fs).filter(k=>fs[k].t==='f').map(k=>esc(fs[k].n)).join(', ')||'нет');
if(has(/(созда|сдела|запиш|добав|нов).*замет|замет.*(созда|нов)|^запиши/)){const c=(q.match(/замет\w*\s*[:\-—]?\s*(.*)$/i)||q.match(/запиши\s+(.*)$/i)||[0,''])[1].trim();const id=mkNode('docs','f','Заметка '+Object.keys(fs).length+'.txt',c);if(!id)return'Не удалось создать заметку.';openNote(id);return'Заметка создана и открыта'+(c?': «'+esc(c)+'»':'.')}
if(m=l.match(/(?:найди|поищи|загугли|погугли|поиск)\s+(?:в интернете|в сети|в браузере)?\s*(.+)/)){openApp('browser');bGo(m[1]);return'Ищу в браузере: <b>'+esc(m[1])+'</b>'}
if(m=l.match(/(?:открой|зайди на)\s+(?:сайт\s+)?((?:https?:\/\/)?[\w-]+\.[a-z]{2,}\S*)/)){openApp('browser');bGo(m[1]);return'Открываю '+esc(m[1])}
if(has(/громкость\D*(\d+)/)){const v=+l.match(/(\d+)/)[1];setVol(v/100);return'Громкость '+v+'%'}
if(has(/громче/)){setVol(vol+.15);return'Громче: '+Math.round(vol*100)+'%'}if(has(/тише/)){setVol(vol-.15);return'Тише: '+Math.round(vol*100)+'%'}
if(has(/следующ.*(трек|песн)|дальше|скип/)){mus('next');return'▶ '+esc(pl[pi].n)}
if(has(/предыдущ|назад.*трек/)){mus('prev');return'◀ '+esc(pl[pi].n)}
if(has(/пауз|останови.*музык|выключи музык/)){if(mplay)mus('pp');return'Пауза.'}
if(has(/(включи|запусти|играй|поставь).*(музык|трек|песн)|музык.*(включи|играй)/)){if(!mplay)mus('pp');openApp('music');return'Играет: '+esc(pl[pi].n)}
if(m=l.match(/яркост\w*\D*(\d+)/)){set.br=cl(+m[1],20,100);applySet();return'Яркость '+set.br+'%'}
if(has(/ночн\w* свет/)){set.nl=/выключ|отключ|убери|off/.test(l)?0:50;applySet();return'Ночной свет '+(set.nl?'включён':'выключен')}
if(m=l.match(/обои\D*(\d)/)){set.wall=cl(+m[1]-1,0,WALLS.length-1);set.img=0;applySet();return'Обои №'+(set.wall+1)}
if(has(/цвет|акцент/)){for(const k in COL)if(l.includes(k)){set.acc=COL[k];applySet();return'Акцентный цвет изменён.'}return'Скажи цвет: красный, синий, зелёный, розовый, фиолетовый, оранжевый, жёлтый…'}
if(has(/парол/)){sTab='u';openApp('settings');sRender();return'Открыл учётную запись — там задаётся пароль.'}
if(has(/заблокир|блокиров/)){setTimeout(lock,300);return'Блокирую экран…'}

if(has(/сверни все|покажи рабочий стол/)){APPS.forEach(a=>wins[a[0]].open&&minW(a[0]));return'Свернул все окна.'}

if(has(/процессор|cpu|разгон|характеристик/))return'CPU: '+CPU[bc.cpu]+', RAM 16 ГБ. Разгон меняется в BIOS (F2).';
const ap=Object.keys(APPW).filter(k=>APPW[k].test(l));
if(ap.length){if(has(/закрой/)){ap.forEach(k=>wins[k].open&&closeW(k));return'Закрыто.'}ap.forEach(k=>openApp(k));return'Открываю: '+ap.map(k=>APPS.find(a=>a[0]===k)[2]).join(', ')}
return'Не уверен, что понял «'+esc(q)+'». Попробуй: «открой музыку», «2+2*3», «создай заметку: …», «яркость 60», «найди в интернете …». Напиши «помощь» — расскажу всё.'}
addEventListener('keydown',e=>{if($('login').classList.contains('show')||$('bios').classList.contains('show'))return;
if(e.key==='Meta'){const b=$('tb').querySelector('[data-t=start]');b&&b.click()}

if(e.key==='Escape')closePops()});
