name: Build NexusOS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check project files
        run: |
          for f in package.json capacitor.config.json www/index.html; do
            if [ -f "$f" ]; then echo "OK: $f"; else echo "::error::Missing file in repository: $f"; exit 1; fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NexusOS.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusOS
          path: NexusOS.apk

      - name: Attach APK to release (tags v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: NexusOS.apk
